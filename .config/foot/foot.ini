include=~/.config/foot/yoru.ini

term=xterm-256color
font=IosevkaTerm NF:size=14
pad=0x0 center

[bell]
system=no

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes

[colors-dark]
alpha=0.9
blur=true

[key-bindings]
scrollback-up-half-page=Control+Shift+u
scrollback-down-half-page=Control+Shift+d
pipe-command-output=[wl-copy] Control+Shift+y
show-urls-launch=Control+Shift+o
show-urls-copy=Control+Shift+l
unicode-input=none
