# A TOML linter such as https://github.com/tombi-toml/tombi can use this schema to validate your config.
# If you encounter any issues, please make an issue at https://github.com/yazi-rs/schemas.

#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
ratio          = [ 1, 3, 4 ]
sort_by        = "natural"
sort_sensitive = false
sort_reverse 	 = false
sort_dir_first = true
sort_translit  = false
sort_fallback  = "alphabetical"
linemode       = "none"
show_hidden    = false
show_symlink   = true
scrolloff      = 5
mouse_events   = []

[preview]
wrap            = "no"
tab_size        = 2
max_width       = 1000
max_height      = 1200
image_delay     = 100
image_filter    = "nearest"
image_quality   = 50
ueberzug_scale  = 1
ueberzug_offset = [ 0, 0, 0, 0 ]

[open]

prepend_rules = [
  { url = "*.cbz", use = "open" }
]

[plugin]
preloaders = []

prepend_previewers = [
  # Archive
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", run = "noop" },
	{ mime = "application/{debian*-package,redhat-package-manager,rpm,android.package-archive}", run = "noop" },
	{ url = "*.{AppImage,appimage}", run = "noop" },
  # Virtual Disk / Disk Image
	{ mime = "application/{iso9660-image,qemu-disk,ms-wim,apple-diskimage}", run = "noop" },
	{ mime = "application/virtualbox-{vhd,vhdx}", run = "noop" },
	{ url = "*.{img,fat,ext,ext2,ext3,ext4,squashfs,ntfs,hfs,hfsx}", run = "noop" },
  # PDF
  { mime = "application/pdf", run = "noop" },
]
